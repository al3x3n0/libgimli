name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.z3_mode.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        z3_mode:
          - name: z3-on
            cmake_args: ""
          - name: z3-off
            cmake_args: "-DDWARF_ENABLE_Z3=OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Z3
        if: matrix.z3_mode.name == 'z3-on' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libz3-dev

      - name: Install Z3
        if: matrix.z3_mode.name == 'z3-on' && runner.os == 'macOS'
        run: brew install z3 pkg-config

      - name: Configure
        run: cmake -S . -B build ${{ matrix.z3_mode.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -E dwarf_package_consumer_smoke

  package-smoke:
    name: package-smoke (${{ matrix.os }}, ${{ matrix.z3_mode.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        z3_mode:
          - name: z3-on
            cmake_args: ""
          - name: z3-off
            cmake_args: "-DDWARF_ENABLE_Z3=OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Z3
        if: matrix.z3_mode.name == 'z3-on' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libz3-dev

      - name: Install Z3
        if: matrix.z3_mode.name == 'z3-on' && runner.os == 'macOS'
        run: brew install z3 pkg-config

      - name: Configure
        run: cmake -S . -B build ${{ matrix.z3_mode.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test Package Install
        run: ctest --test-dir build --output-on-failure -R dwarf_package_consumer_smoke
